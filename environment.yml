name: stim-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=2.0
  - scipy>=1.11.1
  - pandas>=1.5.3
  - matplotlib=3.7.2
  - seaborn=0.13.2
  - scikit-learn=1.3.0
  - statsmodels=0.14.1
  - pytorch>=2.2.0
  - torchvision
  - torchaudio
  - sympy>=1.13
  - jupyter
  - jupyterlab
  - ipykernel
  - notebook
  - pip
  - pip:
    - pennprov==2.2.4
    - mne==1.4.2
    - mne-bids==0.14
    - kneed==0.8.5
    - pingouin==0.5.4
    - krippendorff==0.6.1
    - pqdm==0.2.0
    - statannot==0.2.3
    - tensorflow==2.16.1

