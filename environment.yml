# Conda environment for reproducing the figures and tables in the
# multi-expert seizure annotation dataset descriptor.
#
# Scope: the consensus + reliability pipeline that regenerates every
# paper figure and table from the released consensus annotations.
#   code/annotation_analysis_and_consensus.ipynb   -> builds dataset_consensus.pkl
#   code/analyzing_annotator_reliability.ipynb      -> Figs 5-7, annotations/metadata tables
#
# Notes:
#  - Rebuilding dataset_consensus.pkl from scratch (the *_and_consensus notebook)
#    pulls channel labels from iEEG.org and therefore needs an iEEG.org account
#    plus the raw annotator CSVs in METADATA/. Reproducing the figures/tables
#    from an existing dataset_consensus.pkl does NOT contact iEEG.org.
#  - `ieeg` and `mne-bids` are listed because code/utils.py imports them at module
#    import time; they are required to `import utils` even for the figure-only path.
#  - The WAVENET benchmark (code/WAVENET_validation_analysis.py, Fig 4) additionally
#    needs the DynaSD package and a deep-learning backend and is intentionally out of
#    scope here.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate stim-seizures

name: stim-seizures
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.25.1
  - scipy=1.11.1
  - pandas=1.5.3
  - matplotlib-base=3.7.2
  - seaborn=0.13.2
  - scikit-learn=1.3.0
  - statsmodels=0.14.1
  - mne=1.4.2
  - mne-bids=0.14
  - openpyxl=3.1.4
  - tqdm=4.65.0
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - ieeg
